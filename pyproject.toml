[project]
name = "collector"
version = "0.1.0"
description = "환율·시장지수 수집 배치"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "exchange_calendars>=4.5",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
